<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그룹 · 볼드하다</title>
<link rel="stylesheet" href="/assets/css/account.css">
</head>
<body>
<div class="wrap" id="root">
  <div class="card" id="head">불러오는 중...</div>
  <div class="card" id="memCard" style="display:none">
    <h2>그룹원</h2>
    <div id="members"></div>
    <div id="inviteBox" style="display:none">
      <h2 style="margin-top:18px">친구 초대</h2>
      <div class="row2">
        <input type="text" id="invNick" maxlength="20" placeholder="친구 닉네임">
        <select id="invRole"><option value="editor">만들기 (장면을 맡아 만들어요)</option><option value="viewer">보기 (보기만 해요)</option></select>
      </div>
      <div class="msg" id="invMsg"></div>
      <button class="btn btn-main" id="invSend" type="button">초대 보내기</button>
      <div id="pending"></div>
    </div>
  </div>
  <div class="card" id="workCard" style="display:none">
    <h2>함께 만드는 그림책</h2>
    <div id="works">불러오는 중...</div>
    <div id="newWork" style="display:none">
      <h2 style="margin-top:18px">새 그룹 그림책</h2>
      <label for="nwTitle">제목</label>
      <input type="text" id="nwTitle" maxlength="60" placeholder="예: 우주로 간 고양이">
      <div class="row2">
        <div><label for="nwMode">길이</label><select id="nwMode"><option value="short">단편</option><option value="long">장편</option></select></div>
        <div><label for="nwCount">장면 수 (표지 빼고)</label><select id="nwCount"></select></div>
      </div>
      <div class="msg" id="nwMsg"></div>
      <div class="row2">
        <button class="btn btn-main" id="nwBlank" type="button">새로 시작</button>
        <button class="btn btn-sub" id="nwImport" type="button">📥 내 "스토리 만들기"에서 가져오기</button>
      </div>
      <p class="hint">가져오기: 이 기기의 "스토리 만들기"에 있는 작품(제목·줄거리·캐릭터 그림·장면 글과 그림)을 그룹 그림책으로 복사해요. 원래 작품은 그대로 남아요.</p>
    </div>
  </div>
  <div class="card" id="dangerCard" style="display:none"></div>
</div>
<script src="/assets/js/auth-client.js"></script>
<script src="/assets/js/social-ui.js"></script>
<script src="/assets/js/noti-toast.js"></script>
<script>
(async function () {
  const U = SocialUI, root = document.getElementById('root'), $ = id => document.getElementById(id);
  await U.header(root);
  if (!(await U.session())) { location.replace('/account.html?next=' + encodeURIComponent(location.pathname + location.search)); return; }
  const id = new URLSearchParams(location.search).get('id') || '';
  const ROLE = { owner: '👑 모둠장', editor: '✏️ 만들기', viewer: '👀 보기' };
  const post = async (body, okMsg, reload = true) => {
    try { const r = await U.api('/api/groups', { method: 'POST', body: JSON.stringify({ group_id: id, ...body }) }); if (okMsg) alert(okMsg); if (reload) load(); return r; }
    catch (e) { alert(e.message); return null; }
  };

  function render(d) {
    const owner = d.my_role === 'owner';
    document.title = d.group.name + ' · 볼드하다';
    const head = $('head'); head.innerHTML = '';
    head.append(U.el('h1', '', '👥 ' + d.group.name));
    head.append(U.el('p', 'sub', (d.group.intro ? d.group.intro + ' · ' : '') + '내 역할: ' + ROLE[d.my_role] + ' · ' + d.members.length + '명'));
    if (owner) {
      const ed = U.el('button', 'btn btn-sub', '이름·소개 고치기'); ed.type = 'button';
      ed.onclick = async () => {
        const n = prompt('그룹 이름 (2~30자)', d.group.name); if (n == null) return;
        const t = prompt('소개 (200자까지)', d.group.intro || ''); if (t == null) return;
        post({ action: 'update', name: n, intro: t });
      };
      head.append(ed);
    }

    $('memCard').style.display = '';
    const box = $('members'); box.innerHTML = '';
    d.members.forEach(m => {
      const btns = [];
      if (owner && !m.is_me) {
        btns.push([m.role === 'viewer' ? '만들기로' : '보기로', () => post({ action: 'role', nickname: m.nickname, role: m.role === 'viewer' ? 'editor' : 'viewer' })]);
        btns.push(['모둠장 넘기기', () => { if (confirm(m.nickname + '님에게 모둠장을 넘길까요? 나는 "만들기" 역할이 돼요.')) post({ action: 'role', nickname: m.nickname, role: 'owner' }, '모둠장을 넘겼어요.'); }]);
        btns.push(['내보내기', () => { if (confirm(m.nickname + '님을 그룹에서 내보낼까요?')) post({ action: 'remove', nickname: m.nickname }); }]);
      }
      const row = U.userRow(m, btns);
      row.querySelector('span').textContent = m.nickname + ' · ' + ROLE[m.role] + (m.is_me ? ' (나)' : '');
      box.append(row);
    });

    $('inviteBox').style.display = owner ? '' : 'none';
    const pend = $('pending'); pend.innerHTML = '';
    if (owner && d.invites.length) {
      pend.append(U.el('div', 'hint', '답을 기다리는 초대'));
      d.invites.forEach(i => pend.append(U.userRow(i, [['초대 취소', () => post({ action: 'cancel_invite', invite_id: i.id })]])));
    }
    $('workCard').style.display = '';
    $('newWork').style.display = owner ? '' : 'none';
    loadWorks();

    const dz = $('dangerCard'); dz.innerHTML = ''; dz.style.display = '';
    if (owner) {
      const del = U.el('button', 'btn btn-danger', '그룹 지우기'); del.type = 'button';
      del.onclick = async () => {
        if (!confirm('"' + d.group.name + '" 그룹을 지울까요? 그룹원이 모두 빠지고 되돌릴 수 없어요.')) return;
        if (await post({ action: 'delete' }, null, false)) location.href = '/groups';
      };
      dz.append(U.el('p', 'hint', '모둠장이 그룹을 나가려면 먼저 다른 그룹원에게 모둠장을 넘겨 주세요.'), del);
    } else {
      const lv = U.el('button', 'btn btn-danger', '그룹 나가기'); lv.type = 'button';
      lv.onclick = async () => { if (confirm('그룹을 나갈까요?')) { if (await post({ action: 'leave' }, null, false)) location.href = '/groups'; } };
      dz.append(lv);
    }
  }

  // ── 그룹 그림책 ──
  const STATUS = { open: '아직', editing: '고치는 중', draft: '임시 저장', submitted: '제출됨', approved: '완성', returned: '다시 요청' };
  async function loadWorks() {
    const box = $('works');
    try {
      const d = await U.api('/api/group-stories?group=' + encodeURIComponent(id));
      box.innerHTML = '';
      if (!d.stories.length) box.append(U.el('div', 'empty', '아직 그룹 그림책이 없어요.' + ($('newWork').style.display === 'none' ? ' 모둠장이 만들면 여기에 나와요.' : ' 아래에서 만들어 보세요.')));
      d.stories.forEach(s => {
        const a = U.el('a', 'author'); a.href = '/group-story?id=' + encodeURIComponent(s.id); a.style.cssText = 'display:block;padding:10px 0;border-bottom:1px solid #3a2a3a;margin:0';
        const c = s.counts || {};
        a.append(U.el('div', 'post-title', '📖 ' + s.title), U.el('div', 'hint', (s.mode === 'long' ? '장편' : '단편') + ' · 완성 ' + (c.approved || 0) + '/' + s.scene_count + (c.submitted ? ' · 제출 ' + c.submitted : '') + (s.mine ? ' · 내가 맡은 장면 ' + s.mine : '')));
        box.append(a);
      });
    } catch (e) { box.textContent = e.status === 503 ? '그룹 그림책 기능을 준비 중이에요.' : '불러오지 못했어요.'; }
  }
  for (let n = 3; n <= 20; n++) { const o = document.createElement('option'); o.value = n; o.textContent = n + '장면'; $('nwCount').append(o); }
  $('nwCount').value = 6;
  const nwMsg = (t, cls) => { $('nwMsg').className = 'msg ' + (cls || ''); $('nwMsg').textContent = t; };
  const gsApi = body => U.api('/api/group-stories', { method: 'POST', body: JSON.stringify(body) });

  $('nwBlank').onclick = async () => {
    const title = $('nwTitle').value.trim(); if (!title) return nwMsg('제목을 적어 주세요.', 'err');
    const n = parseInt($('nwCount').value, 10);
    const scenes = [{ k: 'cover', ord: 0, script: '' }].concat(Array.from({ length: n }, (_, i) => ({ k: 'x_' + (i + 1), ord: i + 1, script: '' })));
    try { const r = await gsApi({ action: 'create', group_id: id, mode: $('nwMode').value, title, scenes }); location.href = '/group-story?id=' + encodeURIComponent(r.id); }
    catch (e) { nwMsg(e.message, 'err'); }
  };

  // 이 기기의 스토리 만들기(IndexedDB bold_story)에서 가져오기
  async function readLocalStory() {
    const db = await new Promise((res, rej) => { const r = indexedDB.open('bold_story', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  }
  async function sha256hex(blob) { const h = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  async function toJpeg(src) {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
  }
  async function upload(storyId, dataUrl) {
    const blob = await toJpeg(dataUrl);
    const t = await gsApi({ action: 'asset', story_id: storyId, sha256: await sha256hex(blob), mime: 'image/jpeg', bytes: blob.size });
    if (t.exists) return t.asset_id;
    const c = await BoldAuth.client();
    const up = await c.storage.from(t.bucket).uploadToSignedUrl(t.path, t.token, blob, { contentType: 'image/jpeg' });
    if (up.error) throw new Error('그림을 올리지 못했어요.');
    await gsApi({ action: 'asset_confirm', story_id: storyId, asset_id: t.asset_id });
    return t.asset_id;
  }
  $('nwImport').onclick = async () => {
    const mode = $('nwMode').value;
    try {
      const st = await readLocalStory();
      const p = st && st.proj && st.proj[mode];
      if (!p || !(p.scenes || []).some(s => s.script || s.image)) return nwMsg('이 기기의 "스토리 만들기"에 ' + (mode === 'long' ? '장편' : '단편') + ' 작품이 없어요. 길이를 바꾸거나 먼저 만들어 주세요.', 'err');
      const title = $('nwTitle').value.trim() || p.title || '함께 만드는 그림책';
      const aspect = ['4:3', '3:4', '1:1'].includes(p.aspect) ? p.aspect : '4:3';
      const scenes = [{ k: 'cover', ord: 0, script: '' }].concat(p.scenes.slice(0, 40).map((s, i) => ({ k: s.k, ord: i + 1, script: s.script || '' })));
      nwMsg('그룹 그림책을 만드는 중...');
      const r = await gsApi({ action: 'create', group_id: id, mode, title, scenes, common: { logline: p.logline || '', charDesc: p.charDesc || '', style: p.style || 'storybook', styleText: p.styleText || '', aspect } });
      const images = {}; let n = 0;
      const todo = [['cover', p.cover && p.cover.image]].concat(p.scenes.slice(0, 40).map(s => [s.k, s.image])).filter(x => x[1]);
      for (const [k, img] of todo) { nwMsg('그림 올리는 중... ' + (++n) + '/' + todo.length); images[k] = await upload(r.id, img); }
      if (Object.keys(images).length) await gsApi({ action: 'import_images', story_id: r.id, images });
      if (p.charRef) { nwMsg('캐릭터 그림 올리는 중...'); const cr = await upload(r.id, p.charRef); await gsApi({ action: 'update_common', story_id: r.id, common: { charRef: cr } }); }
      location.href = '/group-story?id=' + encodeURIComponent(r.id);
    } catch (e) { nwMsg('가져오지 못했어요: ' + e.message, 'err'); }
  };

  async function load() {
    try { render(await U.api('/api/groups?id=' + encodeURIComponent(id))); }
    catch (e) {
      if (e.code === 'social_disabled' || e.status === 503) return U.disabledBox(root, e);
      $('head').textContent = e.status === 404 ? '그룹을 찾을 수 없어요. 그룹원만 볼 수 있어요.' : '불러오지 못했어요.';
    }
  }
  $('invSend').onclick = async () => {
    const n = $('invNick').value.trim(); if (!n) return;
    $('invMsg').className = 'msg'; $('invMsg').textContent = '';
    try { await U.api('/api/groups', { method: 'POST', body: JSON.stringify({ action: 'invite', group_id: id, nickname: n, role: $('invRole').value }) }); $('invNick').value = ''; $('invMsg').className = 'msg ok'; $('invMsg').textContent = n + '님에게 초대를 보냈어요.'; load(); }
    catch (e) { $('invMsg').className = 'msg err'; $('invMsg').textContent = e.message; }
  };
  load();
})();
</script>
</body>
</html>
