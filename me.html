<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이페이지 · 볼드하다</title>
<link rel="stylesheet" href="/assets/css/account.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">볼드하다</a>
    <button class="chip" id="btnLogout" type="button">로그아웃</button>
  </div>
  <a class="btn btn-main" href="/" style="text-decoration:none">← 제작 화면으로 돌아가기</a>

  <div class="card" id="loading">불러오는 중...</div>

  <div id="main" style="display:none">
    <div class="card">
      <h1>내 프로필</h1>
      <p class="sub" id="acctInfo"></p>

      <div class="avatar-row">
        <img class="avatar" id="avatar" alt="프로필 이미지">
        <div>
          <button class="chip" id="btnAvatar" type="button">이미지 변경</button>
          <button class="chip" id="btnAvatarDel" type="button">삭제</button>
          <div class="hint">PNG·JPG·WEBP, 2MB 이하</div>
          <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" style="display:none">
        </div>
      </div>

      <label for="nickname">닉네임 (2~20자, 한글·영문·숫자·_)</label>
      <input type="text" id="nickname" maxlength="20" autocomplete="off">

      <label for="bio">소개 (300자 이내)</label>
      <textarea id="bio" maxlength="300"></textarea>

      <label>관심 분야 (최대 10개)</label>
      <div class="chips" id="interestChips"></div>
      <input type="text" id="interestExtra" maxlength="20" placeholder="직접 추가 후 Enter" style="margin-top:10px">

      <label for="visibility">프로필 공개 범위</label>
      <select id="visibility">
        <option value="private">비공개 — 나만 볼 수 있어요</option>
        <option value="followers">팔로워 공개 (준비 중, 지금은 비공개와 같아요)</option>
        <option value="public">전체 공개 — 누구나 볼 수 있어요</option>
      </select>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="btn btn-main" id="btnSave" type="button">저장하기</button>
    </div>

    <div class="card" id="kidsCard" style="display:none">
      <h2>자녀 프로필</h2>
      <p class="sub">만 14세 미만 자녀는 보호자 계정 안의 프로필로 이용해요. 자녀 프로필은 항상 비공개이며, 메시지·공개 게시·친구 기능은 쓸 수 없어요.</p>
      <div id="kidsList"></div>
      <div id="kidsRestore"></div>

      <div id="kidsDeclare" style="display:none">
        <label class="consent" for="declareChk"><input type="checkbox" id="declareChk"><span>저는 만 19세 이상이며, 자녀의 법정대리인(보호자)입니다.</span></label>
        <button class="btn btn-sub" id="btnDeclare" type="button">보호자로 확인하기</button>
      </div>

      <div id="kidsAdd" style="display:none">
        <button class="btn btn-main" id="btnKidsOpen" type="button">+ 자녀 프로필 추가</button>
        <div id="kidsForm" style="display:none">
          <label for="kNick">자녀 닉네임 (실명 대신 별명을 써 주세요, 2~12자)</label>
          <input type="text" id="kNick" maxlength="12" autocomplete="off">
          <label>아바타</label>
          <div class="chips" id="kAvatars"></div>
          <label for="kAge">연령대</label>
          <select id="kAge"><option value="7-9">7~9세</option><option value="10-13">10~13세</option></select>
          <label for="kPin">보호자 PIN 4자리 (아이 모드에서 나갈 때 필요해요)</label>
          <input type="text" id="kPin" maxlength="4" inputmode="numeric" autocomplete="off">

          <div class="hint" style="margin-top:16px">법정대리인 동의 (모두 필요해요)</div>
          <label class="consent" for="c1"><input type="checkbox" id="c1"><span>[수집·이용] 닉네임, 아바타, 연령대, 자녀가 만든 작품을 서비스 제공 목적으로 수집·이용하는 데 동의합니다.</span></label>
          <label class="consent" for="c2"><input type="checkbox" id="c2"><span>[AI 처리] 자녀가 만든 그림·글이 AI 기능 사용 시 외부 AI 서비스(구글, OpenAI 등)로 전송되어 처리될 수 있음에 동의합니다.</span></label>
          <label class="consent" for="c3"><input type="checkbox" id="c3"><span>[보관] 프로필을 삭제하면 30일 뒤 작품과 함께 영구 삭제됨을 확인했습니다.</span></label>
          <label class="consent" for="c4"><input type="checkbox" id="c4"><span>[권리] 보호자는 언제든 열람·수정·삭제·동의 철회를 요청할 수 있음을 확인했습니다.</span></label>
          <div class="msg" id="kMsg" role="status" aria-live="polite"></div>
          <div class="row2">
            <button class="btn btn-main" id="btnKidsCreate" type="button">추가하기</button>
            <button class="btn btn-sub" id="btnKidsCancel" type="button">취소</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>내 작업물</h2>
      <div class="row2" style="margin-bottom:12px">
        <button class="chip on" id="tabWorks" type="button">내 작업</button>
        <button class="chip" id="tabTrash" type="button">휴지통</button>
      </div>
      <div class="hint" id="quotaText" style="margin-bottom:6px"></div>
      <div style="height:8px;background:#2d0040;margin-bottom:14px"><div id="quotaBar" style="height:100%;width:0;background:var(--yellow)"></div></div>
      <div id="worksList"></div>
      <p class="hint" id="worksNote">제작 도구에서 로그인한 계정으로 저장하는 기능은 도구별로 차례로 연결돼요. 지금은 기존처럼 저장해 주세요.</p>
    </div>

    <div class="card">
      <h2>계정</h2>
      <p class="sub">계정을 삭제하면 프로필이 영구히 삭제되며 되돌릴 수 없어요.</p>
      <button class="btn btn-danger" id="btnDelete" type="button">계정 삭제</button>
    </div>
  </div>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>

<script src="/assets/js/auth-client.js"></script>
<script src="/assets/js/cloud-save.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const PRESETS = ['캐릭터', '일러스트', '스토리', '그림책', '영상', '더빙', '게임', '만화'];
  const MAX_AVATAR = 2 * 1024 * 1024;
  let profile = null, interests = [], dirty = false, userId = null;

  let statusTimer;
  function status(text, cls, keep) {
    const el = $('status'); el.textContent = text; el.className = 'status show ' + (cls || '');
    clearTimeout(statusTimer);
    if (!keep) statusTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }
  const msg = (t, cls) => { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (cls || ''); };
  const ERR = {
    invalid_nickname: '닉네임은 2~20자의 한글·영문·숫자·_ 만 쓸 수 있어요.',
    nickname_taken: '이미 사용 중인 닉네임이에요.',
    bio_too_long: '소개가 너무 길어요.',
    invalid_interests: '관심 분야는 최대 10개, 20자 이내로 입력해 주세요.',
    profiles_not_ready: '프로필 기능이 아직 준비되지 않았어요.',
    login_required: '로그인이 필요해요.'
  };
  const DEFAULT_AVATAR = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84"><rect width="84" height="84" fill="#2d0040"/><circle cx="42" cy="32" r="14" fill="#a11cee"/><rect x="16" y="52" width="52" height="30" rx="14" fill="#a11cee"/></svg>');

  function renderChips() {
    const all = [...new Set([...PRESETS, ...interests])];
    $('interestChips').innerHTML = '';
    all.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (interests.includes(t) ? ' on' : ''); b.textContent = t;
      b.onclick = () => {
        if (interests.includes(t)) interests = interests.filter(x => x !== t);
        else if (interests.length < 10) interests.push(t);
        else { msg('관심 분야는 최대 10개예요.', 'err'); return; }
        dirty = true; renderChips();
      };
      $('interestChips').appendChild(b);
    });
  }

  function fill(p) {
    profile = p; interests = p.interests || [];
    $('nickname').value = p.nickname || '';
    $('bio').value = p.bio || '';
    $('visibility').value = p.visibility || 'private';
    $('avatar').src = p.avatar_url || DEFAULT_AVATAR;
    const prov = { google: '구글', kakao: '카카오' }[p.provider] || p.provider || '';
    $('acctInfo').textContent = (prov ? prov + ' 계정' : '') + (p.email ? ' · ' + p.email : '');
    renderChips();
  }

  async function save() {
    msg('');
    $('btnSave').disabled = true; status('저장 중...', '', true);
    try {
      const p = await BoldAuth.api('/api/me', { method: 'PATCH', body: JSON.stringify({
        nickname: $('nickname').value.trim(), bio: $('bio').value.trim(),
        interests: interests, visibility: $('visibility').value
      }) });
      profile = Object.assign(profile, p); dirty = false;
      status('저장됨 ✓', 'ok'); msg('');
    } catch (e) {
      msg(ERR[e.message] || '저장하지 못했어요. 잠시 후 다시 시도해 주세요.', 'err'); status('저장 실패', 'err');
    } finally { $('btnSave').disabled = false; }
  }

  async function uploadAvatar(file) {
    if (['image/png', 'image/jpeg', 'image/webp'].indexOf(file.type) < 0) { msg('PNG, JPG, WEBP 이미지만 올릴 수 있어요.', 'err'); return; }
    if (file.size > MAX_AVATAR) { msg('이미지는 2MB 이하만 올릴 수 있어요.', 'err'); return; }
    status('이미지 올리는 중...', '', true);
    try {
      const c = await BoldAuth.client();
      const ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[file.type];
      const path = userId + '/' + Date.now() + '.' + ext;
      const up = await c.storage.from('avatars').upload(path, file, { contentType: file.type, upsert: false });
      if (up.error) throw up.error;
      const url = c.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      const p = await BoldAuth.api('/api/me', { method: 'PATCH', body: JSON.stringify({ avatar_url: url }) });
      fill(Object.assign(profile, p)); status('이미지가 바뀌었어요 ✓', 'ok');
    } catch (e) { msg('이미지를 올리지 못했어요.', 'err'); status('업로드 실패', 'err'); }
  }

  $('btnSave').onclick = save;
  ['nickname', 'bio', 'visibility'].forEach(id => $(id).addEventListener('input', () => { dirty = true; }));
  $('interestExtra').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const t = e.target.value.trim();
    if (!t) return;
    if (interests.length >= 10) { msg('관심 분야는 최대 10개예요.', 'err'); return; }
    if (interests.indexOf(t) < 0) interests.push(t);
    e.target.value = ''; dirty = true; renderChips();
  });
  $('btnAvatar').onclick = () => $('avatarFile').click();
  $('avatarFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadAvatar(f); };
  $('btnAvatarDel').onclick = async () => {
    try { const p = await BoldAuth.api('/api/me', { method: 'PATCH', body: JSON.stringify({ avatar_url: null }) }); fill(Object.assign(profile, p)); status('삭제됨 ✓', 'ok'); }
    catch (e) { status('삭제 실패', 'err'); }
  };
  $('btnLogout').onclick = async () => { await BoldAuth.signOut(); location.href = '/'; };
  $('btnDelete').onclick = async () => {
    if (prompt('계정을 삭제하려면 "삭제"라고 입력하세요. 되돌릴 수 없습니다.') !== '삭제') return;
    status('삭제 중...', '', true);
    try { await BoldAuth.api('/api/me', { method: 'DELETE', body: JSON.stringify({ confirm: 'DELETE' }) }); await BoldAuth.signOut().catch(() => {}); location.href = '/'; }
    catch (e) { status('삭제하지 못했어요', 'err'); }
  };
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ── 자녀 프로필 (서버 기능 플래그가 꺼져 있으면 이 영역은 숨겨진 상태 유지) ── */
  const AV = { fox: '🦊', cat: '🐱', bear: '🐻', rabbit: '🐰', robot: '🤖', star: '⭐', dino: '🦖', panda: '🐼' };
  const CONSENT_KEYS = ['collect', 'ai_processing', 'retention', 'guardian_rights'];
  const KERR = {
    invalid_nickname: '닉네임은 2~12자의 한글·영문·숫자·_ 만 쓸 수 있어요.', nickname_taken: '이미 사용 중인 닉네임이에요.',
    invalid_pin: 'PIN은 숫자 4자리예요.', consent_required: '동의 항목을 모두 확인해 주세요.',
    child_limit: '자녀 프로필은 최대 5명까지 만들 수 있어요.', guardian_declaration_required: '먼저 보호자 확인이 필요해요.',
    restore_expired: '복구 가능 기간이 지났어요.'
  };
  let kids = { consent_version: '', avatar: 'fox' };

  function kidMode() { try { return JSON.parse(localStorage.getItem('bold_child') || 'null'); } catch (e) { return null; } }
  function setKidMode(c) { try { if (c) localStorage.setItem('bold_child', JSON.stringify(c)); else localStorage.removeItem('bold_child'); } catch (e) {} }

  function renderKids(d) {
    kids.consent_version = d.consent_version;
    $('kidsCard').style.display = 'block';
    $('kidsDeclare').style.display = d.guardian_declared ? 'none' : 'block';
    $('kidsAdd').style.display = d.guardian_declared ? 'block' : 'none';
    const list = $('kidsList'); list.innerHTML = '';
    d.children.forEach(c => {
      const row = document.createElement('div'); row.className = 'row2'; row.style.marginBottom = '10px';
      const info = document.createElement('div'); info.style.alignSelf = 'center';
      info.textContent = (AV[c.avatar_key] || '🙂') + ' ' + c.nickname + ' · ' + c.age_group + '세';
      const go = document.createElement('button'); go.className = 'btn btn-main'; go.type = 'button'; go.style.marginBottom = '0'; go.textContent = '아이 모드로 시작';
      go.onclick = () => { setKidMode({ id: c.id, nickname: c.nickname, avatar_key: c.avatar_key }); location.href = '/'; };
      const del = document.createElement('button'); del.className = 'btn btn-danger'; del.type = 'button'; del.style.marginBottom = '0'; del.textContent = '삭제';
      del.onclick = async () => {
        if (!confirm('"' + c.nickname + '" 프로필을 삭제할까요? 30일 안에는 복구할 수 있고, 이후 작품과 함께 영구 삭제돼요.')) return;
        try { await BoldAuth.api('/api/children', { method: 'DELETE', body: JSON.stringify({ id: c.id }) }); const k = kidMode(); if (k && k.id === c.id) setKidMode(null); loadKids(); status('삭제됨 (30일 안에 복구 가능)', 'ok'); }
        catch (e) { status('삭제하지 못했어요', 'err'); }
      };
      row.append(info, go, del); list.appendChild(row);
    });
    const rs = $('kidsRestore'); rs.innerHTML = '';
    d.restorable.forEach(c => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = '↩ "' + c.nickname + '" 삭제 취소';
      b.onclick = async () => { try { await BoldAuth.api('/api/children?action=restore', { method: 'POST', body: JSON.stringify({ id: c.id }) }); loadKids(); } catch (e) { status(KERR[e.message] || '복구하지 못했어요', 'err'); } };
      rs.appendChild(b);
    });
  }
  async function loadKids() {
    try { renderKids(await BoldAuth.api('/api/children')); }
    catch (e) { /* feature_disabled(404) 등 → 영역 숨김 */ $('kidsCard').style.display = 'none'; }
  }
  function renderAvatarPick() {
    $('kAvatars').innerHTML = '';
    Object.keys(AV).forEach(k => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (kids.avatar === k ? ' on' : ''); b.textContent = AV[k];
      b.setAttribute('aria-label', k); b.onclick = () => { kids.avatar = k; renderAvatarPick(); };
      $('kAvatars').appendChild(b);
    });
  }
  const kmsg = (t, c) => { $('kMsg').textContent = t || ''; $('kMsg').className = 'msg ' + (c || ''); };
  $('btnDeclare').onclick = async () => {
    if (!$('declareChk').checked) { status('확인란에 체크해 주세요', 'err'); return; }
    try { await BoldAuth.api('/api/children?action=declare', { method: 'POST', body: JSON.stringify({ adult: true }) }); loadKids(); }
    catch (e) { status('확인하지 못했어요', 'err'); }
  };
  $('btnKidsOpen').onclick = () => { $('kidsForm').style.display = 'block'; $('btnKidsOpen').style.display = 'none'; renderAvatarPick(); };
  $('btnKidsCancel').onclick = () => { $('kidsForm').style.display = 'none'; $('btnKidsOpen').style.display = 'flex'; kmsg(''); };
  $('btnKidsCreate').onclick = async () => {
    kmsg('');
    const items = { collect: $('c1').checked, ai_processing: $('c2').checked, retention: $('c3').checked, guardian_rights: $('c4').checked };
    if (!CONSENT_KEYS.every(k => items[k])) { kmsg(KERR.consent_required, 'err'); return; }
    $('btnKidsCreate').disabled = true;
    try {
      await BoldAuth.api('/api/children', { method: 'POST', body: JSON.stringify({
        nickname: $('kNick').value.trim(), avatar_key: kids.avatar, age_group: $('kAge').value, pin: $('kPin').value.trim(),
        consent: { version: kids.consent_version, items: items } }) });
      ['kNick', 'kPin'].forEach(id => $(id).value = ''); ['c1', 'c2', 'c3', 'c4'].forEach(id => $(id).checked = false);
      $('btnKidsCancel').onclick(); loadKids(); status('자녀 프로필을 추가했어요 ✓', 'ok');
    } catch (e) { kmsg(KERR[e.message] || '추가하지 못했어요. 잠시 후 다시 시도해 주세요.', 'err'); }
    finally { $('btnKidsCreate').disabled = false; }
  };

  /* ── 내 작업 / 휴지통 ── */
  const KIND = { draw: '✏️ 직접 그리기', story: '📖 스토리 만들기', character: '👗 캐릭터', storyboard: '🎬 스토리보드', dub: '📚 그림책 더빙' };
  let showTrash = false;
  const mb = n => (Number(n || 0) / 1048576).toFixed(1) + 'MB';
  const WERR = { projects_not_ready: '작업 저장 기능이 아직 준비되지 않았어요.' };

  function workRow(p) {
    const row = document.createElement('div'); row.className = 'row2'; row.style.cssText = 'margin-bottom:10px;align-items:center';
    const thumb = document.createElement('img'); thumb.className = 'avatar'; thumb.style.cssText = 'width:56px;height:56px;border-radius:0;flex:none';
    thumb.alt = ''; thumb.src = p.thumb_url || DEFAULT_AVATAR;
    const info = document.createElement('div'); info.style.flex = '1';
    const t = document.createElement('div'); t.textContent = p.title || '(제목 없음)'; t.style.fontWeight = '700';
    const m = document.createElement('div'); m.className = 'hint';
    m.textContent = (KIND[p.kind] || p.kind) + ' · ' + new Date(p.updated_at).toLocaleDateString('ko-KR') + ' · ' + mb(p.size_bytes);
    info.append(t, m);
    const btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:6px;flex:none';
    const mk = (label, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + (cls || ''); b.textContent = label; b.onclick = fn; return b; };
    if (!showTrash) {
      btns.append(mk('삭제', '', async () => {
        if (!confirm('"' + (p.title || '제목 없음') + '"을 휴지통으로 옮길까요? 30일 안에는 복구할 수 있어요.')) return;
        try { await CloudSave.trash(p.id); loadWorks(); status('휴지통으로 옮겼어요', 'ok'); } catch (e) { status('삭제하지 못했어요', 'err'); }
      }));
    } else {
      btns.append(mk('복구', '', async () => { try { await CloudSave.restore(p.id); loadWorks(); status('복구했어요 ✓', 'ok'); } catch (e) { status('복구하지 못했어요', 'err'); } }));
      btns.append(mk('영구 삭제', '', async () => {
        if (!confirm('"' + (p.title || '제목 없음') + '"을 영구 삭제할까요? 되돌릴 수 없어요.')) return;
        try { await CloudSave.purge(p.id); loadWorks(); status('영구 삭제했어요', 'ok'); } catch (e) { status('삭제하지 못했어요', 'err'); }
      }));
    }
    row.append(thumb, info, btns);
    return row;
  }
  async function loadWorks() {
    $('tabWorks').classList.toggle('on', !showTrash); $('tabTrash').classList.toggle('on', showTrash);
    const box = $('worksList');
    try {
      const d = await CloudSave.list({ trashed: showTrash });
      box.innerHTML = '';
      const q = d.quota || { bytes_used: 0, limit_bytes: 524288000 };
      $('quotaText').textContent = '저장 공간 ' + mb(q.bytes_used) + ' / ' + mb(q.limit_bytes) + ' 사용 중';
      $('quotaBar').style.width = Math.min(100, (q.bytes_used / q.limit_bytes) * 100) + '%';
      if (!d.projects.length) {
        const e = document.createElement('div'); e.className = 'empty';
        e.textContent = showTrash ? '휴지통이 비어 있어요. 지운 작업은 ' + d.trash_days + '일 동안 여기에 보관돼요.' : '아직 저장된 작업이 없어요.';
        box.appendChild(e);
      } else d.projects.forEach(p => box.appendChild(workRow(p)));
    } catch (e) {
      box.innerHTML = ''; $('quotaText').textContent = '';
      const m = document.createElement('div'); m.className = 'empty'; m.textContent = WERR[e.message] || '작업 목록을 불러오지 못했어요.'; box.appendChild(m);
    }
  }
  $('tabWorks').onclick = () => { showTrash = false; loadWorks(); };
  $('tabTrash').onclick = () => { showTrash = true; loadWorks(); };

  // 아이 모드에서 마이페이지에 들어오면 보호자 PIN 확인 (같은 기기에서 아이가 실수로 열지 않게 하는 편의 장치)
  async function kidPinGate() {
    const k = kidMode();
    if (!k) return true;
    const pin = prompt('보호자 PIN 4자리를 입력하세요.');
    if (pin == null) { location.replace('/'); return false; }
    try {
      await BoldAuth.api('/api/children?action=verify-pin', { method: 'POST', body: JSON.stringify({ id: k.id, pin: pin.trim() }) });
      setKidMode(null); return true;
    } catch (e) { alert('PIN이 맞지 않아요.'); location.replace('/'); return false; }
  }

  (async () => {
    try {
      const s = await BoldAuth.session();
      if (!s) { location.replace('/account.html?next=' + encodeURIComponent('/me.html')); return; }
      userId = s.user.id;
      if (!(await kidPinGate())) return;
      fill(await BoldAuth.api('/api/me'));
      $('loading').style.display = 'none'; $('main').style.display = 'block';
      loadKids();
      loadWorks();
    } catch (e) {
      if (e.status === 401) { location.replace('/account.html?next=' + encodeURIComponent('/me.html')); return; }
      $('loading').textContent = ERR[e.message] || '프로필을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    }
  })();
})();
</script>
</body>
</html>
