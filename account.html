<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 · 볼드하다</title>
<link rel="stylesheet" href="/assets/css/account.css">
</head>
<body>
<div class="wrap">
  <div class="top"><a class="brand" href="/">볼드하다</a></div>
  <a class="btn btn-sub" href="/" style="text-decoration:none">← 제작 화면으로 돌아가기</a>

  <div class="card">
    <h1>로그인 / 회원가입</h1>
    <p class="sub">소셜 계정으로 간편하게 시작하세요. 처음이면 자동으로 가입됩니다.<br>만 14세 미만 어린이는 직접 가입할 수 없어요. 보호자가 가입한 뒤 마이페이지에서 자녀 프로필을 만들어 주세요. (로그인 없이도 기본 도구는 쓸 수 있어요.)</p>

    <label class="consent" for="consent">
      <input type="checkbox" id="consent">
      <span>만 14세 이상이며, <a href="/terms" target="_blank" rel="noopener">서비스 이용약관</a>과 <a href="/privacy" target="_blank" rel="noopener">개인정보 처리방침</a>에 동의합니다.</span>
    </label>

    <button class="btn btn-google" id="btnGoogle" disabled>Google로 계속하기</button>
    <button class="btn btn-kakao" id="btnKakao" disabled>카카오로 계속하기</button>
    <button class="btn btn-naver" id="btnNaver" disabled style="display:none">네이버로 계속하기</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <p class="hint">로그인하면 기기를 바꿔도 내 작업을 이어서 할 수 있어요. 프로필은 기본적으로 비공개입니다.</p>
  </div>
</div>

<script src="/assets/js/auth-client.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const next = BoldAuth.safeNext(params.get('next'), '/me.html');
  const msg = (t, cls) => { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (cls || ''); };

  // 소셜 로그인 실패(사용자가 취소 등) 시 돌아온 오류 표시
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const oauthErr = params.get('error_description') || hash.get('error_description');
  if (oauthErr) msg('로그인에 실패했어요. 다시 시도해 주세요.', 'err');
  const NAVER_ERR = {
    naver_denied: '네이버 로그인이 취소됐어요.',
    naver_not_configured: '네이버 로그인은 아직 준비 중이에요.'
  };
  const nErr = hash.get('error');
  if (nErr) msg(NAVER_ERR[nErr] || '네이버 로그인에 실패했어요. 다시 시도해 주세요.', 'err');

  const buttons = [$('btnGoogle'), $('btnKakao'), $('btnNaver')];
  const sync = () => buttons.forEach(b => { b.disabled = !$('consent').checked; });
  $('consent').addEventListener('change', sync);

  async function go(provider) {
    if (!$('consent').checked) { msg('동의 항목을 확인해 주세요.', 'err'); return; }
    msg('이동 중...'); buttons.forEach(b => b.disabled = true);
    try { await BoldAuth.signIn(provider, next); }
    catch (e) { msg(e.message || '로그인을 시작하지 못했어요.', 'err'); sync(); }
  }
  $('btnGoogle').addEventListener('click', () => go('google'));
  $('btnKakao').addEventListener('click', () => go('kakao'));
  $('btnNaver').addEventListener('click', () => {
    if (!$('consent').checked) { msg('동의 항목을 확인해 주세요.', 'err'); return; }
    location.href = '/api/auth/naver/start?next=' + encodeURIComponent(next);
  });

  // 네이버 로그인은 서버 설정이 되어 있을 때만 버튼을 보여 줌
  BoldAuth.publicConfig().then(c => { if (c.naverEnabled) { $('btnNaver').style.display = 'flex'; sync(); } }).catch(() => {});

  // 네이버 로그인 직후: 서버가 넘겨준 1회용 토큰으로 세션 만들기
  const naverToken = hash.get('naver_th');
  if (naverToken) {
    history.replaceState(null, '', location.pathname + location.search); // 주소창에서 토큰 제거
    msg('로그인 중...');
    BoldAuth.verifyNaver(naverToken)
      .then(() => location.replace(next))
      .catch(() => msg('네이버 로그인에 실패했어요. 다시 시도해 주세요.', 'err'));
  } else {
    // 이미 로그인된 경우(또는 소셜 로그인 직후 돌아온 경우) 바로 이동
    BoldAuth.session().then(s => { if (s) location.replace(next); })
      .catch(e => msg(e.message, 'err'));
  }
})();
</script>
<script src="/assets/js/notice.js"></script>
</body>
</html>
