<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 · 볼드하다</title>
<link rel="stylesheet" href="/assets/css/account.css">
<style>
  .adm-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
  .adm-nav button{padding:12px 6px;border:3px solid var(--purple);background:transparent;color:var(--text);font:inherit;font-weight:800;font-size:1rem;cursor:pointer;position:relative}
  .adm-nav button.on{background:var(--purple)}
  .badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;background:#ff4f7a;color:#fff;font-size:.75rem;font-weight:900;border-radius:10px}
  .adm-sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;padding:8px;border:2px solid #3a2a3a;background:rgba(255,255,255,.03)}
  .adm-sub:empty{display:none}
  .adm-sub .chip{padding:6px 12px}
  .sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .sec-head h2{margin:0}
  details.box{border:2px solid #3a2a3a;padding:8px 12px;margin:8px 0 14px}
  details.box>summary{cursor:pointer;font-weight:800;color:var(--yellow);padding:4px 0}
  details.box[open]>summary{margin-bottom:8px}
  .gtable{width:100%;border-collapse:collapse;font-size:.9rem}
  .gtable td,.gtable th{border-bottom:1px solid #3a2a3a;padding:8px 6px;text-align:left;vertical-align:middle}
  .gtable th{font-size:.8rem;opacity:.75;font-weight:700}
  .gtable select{width:auto;max-width:100%}
  .need-ok{color:#5ad17a;font-weight:700}.need-bad{color:#ff7a8a;font-weight:700}
  .linkbtn{background:none;border:0;color:var(--yellow);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
  .catbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .catbar .chip{padding:4px 10px;font-size:.8rem}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .wcard{border:2px solid #3a2a3a;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
  .wcard.off{opacity:.45}
  .wcard .w{font-weight:800;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .wcard .w small{font-weight:400;opacity:.7;font-size:.75rem}
  .wcard .tg{display:flex;gap:4px;flex-wrap:wrap}
  .tg button,.mini{padding:2px 7px;font-size:.75rem;border:2px solid var(--purple);background:transparent;color:var(--text);cursor:pointer;font-family:inherit}
  .tg button.on{background:var(--purple)}
  .mini.danger{border-color:#ff4f7a}
  .igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .icard{border:2px solid #3a2a3a;padding:6px;font-size:.85rem;display:flex;flex-direction:column;gap:5px}
  .icard.off{opacity:.45}
  .icard img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;display:block}
  .icard .row{display:flex;gap:4px;flex-wrap:wrap}
  .setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .setcard{border:2px solid #3a2a3a;padding:8px;font-size:.85rem}
  .setcard.off{opacity:.45}
  .setcard .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}
  .setcard .thumbs img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;display:block}
  .setcard .thumbs div{font-size:.7rem;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qopt{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .qopt input[type=text]{flex:1;margin:0}
  .qopt input[type=radio]{width:auto;margin:0}
  @media (max-width:560px){.adm-nav{grid-template-columns:repeat(3,1fr)}.adm-nav button{font-size:.85rem;padding:10px 2px}}
</style>
</head>
<body>
<div class="wrap wide">
  <div class="top"><a class="brand" href="/">볼드하다 관리자</a><a class="chip" href="/feed" style="text-decoration:none">둘러보기</a></div>

  <div class="card" id="login">
    <h2>관리자 로그인</h2>
    <p class="sub">제작 화면의 ADMIN 비밀번호와 같아요. 새로고침하면 다시 로그인해야 해요.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="관리자 비밀번호" style="width:100%;padding:12px;background:#0d0008;color:#fff;border:2px solid var(--purple);font-size:16px">
    <div class="msg" id="loginMsg"></div>
    <button class="btn btn-main" id="btnLogin" type="button">로그인</button>
  </div>

  <div id="main" style="display:none">
    <!-- 큰 메뉴(게시물·회원·게임·설정) → 아래 작은 메뉴 -->
    <div class="adm-nav" id="groups"></div>
    <div class="adm-sub" id="tabs"></div>
    <div class="card" id="view"></div>
  </div>
</div>
<div class="status" id="status"></div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let HASH = '';
  const REASON = { inappropriate: '부적절한 그림·글', bullying: '괴롭힘·욕설', privacy: '개인정보', copyright: '저작권', spam: '도배·광고', other: '기타' };
  const KIND = { draw: '그림', character: '캐릭터', storyboard: '스토리보드', story: '그림책', dub: '더빙' };
  const SANC = { warning: '경고', post_ban: '게시 금지', suspend: '이용 정지' };
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const dt = s => s ? new Date(s).toLocaleString('ko-KR') : '';
  function status(text, cls) { const s = $('status'); s.textContent = text; s.className = 'status show ' + (cls || ''); clearTimeout(s._t); s._t = setTimeout(() => s.className = 'status', 2500); }

  async function api(path, body) {
    const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': HASH }, body: JSON.stringify(body) }
      : { headers: { 'X-Admin-Hash': HASH } });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error === 'social_not_ready' ? 'DB(0009)가 아직 적용되지 않았어요.' : (d.error || '요청 실패 (' + res.status + ')'));
    return d;
  }
  async function act(body, okText) {
    try { await api('/api/admin/social', body); status(okText || '처리했어요 ✓', 'ok'); show(cur); loadBadges(); } catch (e) { status(e.message, 'err'); }
  }
  const ask = (q, def) => { const v = prompt(q, def || ''); return v == null ? null : v.trim(); };

  async function sha256hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  $('btnLogin').onclick = async () => {
    const pw = $('pw').value; if (!pw) return;
    $('loginMsg').textContent = '확인 중...';
    const h = await sha256hex(pw);
    const r = await fetch('/api/admin-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hash: h }) });
    if (!r.ok) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = r.status === 503 ? '관리자 기능이 설정되지 않았어요.' : '비밀번호가 틀렸어요.'; return; }
    HASH = h; $('pw').value = ''; $('login').style.display = 'none'; $('main').style.display = ''; show(startView()); loadBadges();
  };
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
  // 제작 화면의 '🎮 게임 관리' 버튼으로 열렸으면: 연 창(같은 사이트)에게 관리자 확인값을 받아 서버에서 다시 확인한 뒤 게임 탭을 바로 연다
  if (/^#(games|content|settings)/.test(location.hash) && window.opener) {
    window.addEventListener('message', async e => {
      if (e.origin !== location.origin || e.source !== window.opener || !e.data || e.data.type !== 'bold-admin-hash') return;
      const h = String(e.data.hash || '');
      if (!/^[0-9a-f]{64}$/.test(h) || HASH) return;
      const r2 = await fetch('/api/admin-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hash: h }) });
      if (!r2.ok) return;
      HASH = h; $('login').style.display = 'none'; $('main').style.display = ''; show(startView()); loadBadges();
    });
    try { window.opener.postMessage({ type: 'bold-admin-hash-request' }, location.origin); } catch (e) {}
  }

  let cur = 'pending';
  // 큰 메뉴 → 작은 메뉴 [키, 이름]
  const NAV = [
    ['posts', '📋 게시물', [['pending', '승인 대기'], ['reports', '🚩 신고'], ['hidden', '가려진 게시물'], ['published', '공개 중'], ['rejected', '거절됨']]],
    ['users', '👤 회원', [['user', '회원 찾기·제재']]],
    ['games', '🎮 게임', [['games', '📊 현황·공개'], ['g_words', '🔤 제시어'], ['g_memory', '🧠 닮은꼴 세트'], ['g_puzzle', '🧩 퍼즐 그림'], ['g_quiz', '❓ 상식 퀴즈']]],
    ['content', '🎨 콘텐츠', [['c_decor', '🧍 꾸미기 요소'], ['c_tpl', '🖼 그리기 템플릿']]],
    ['settings', '⚙ 설정', [['settings', '게시 설정'], ['s_aipw', '🔑 AI 비밀번호'], ['s_aiuse', '📊 AI 사용량·한도']]],
  ];
  const HASHV = { c_decor: '#content/decor', c_tpl: '#content/templates', s_aipw: '#settings/ai-password', s_aiuse: '#settings/ai-usage', games: '#games', g_words: '#games/words', g_memory: '#games/memory', g_puzzle: '#games/puzzle', g_quiz: '#games/quiz' };
  const lastSub = {};
  const badge = { pending: 0, reports: 0 };
  const groupOf = v => NAV.find(g => g[2].some(t => t[0] === v)) || NAV[0];
  function startView() { const h = location.hash; const hit = Object.entries(HASHV).find(([, x]) => x === h); return hit ? hit[0] : h.startsWith('#games') ? 'games' : h.startsWith('#content') ? 'c_decor' : 'pending'; }
  function drawNav(v) {
    const grp = groupOf(v); lastSub[grp[0]] = v;
    const G = $('groups'); G.innerHTML = '';
    NAV.forEach(g => {
      const b = el('button', g === grp ? 'on' : '', g[1]); b.type = 'button';
      const n = g[0] === 'posts' ? badge.pending + badge.reports : 0;
      if (n) b.append(el('span', 'badge', String(n)));
      b.onclick = () => show(lastSub[g[0]] || g[2][0][0]);
      G.append(b);
    });
    const T = $('tabs'); T.innerHTML = '';
    if (grp[2].length > 1) grp[2].forEach(([k, t]) => {
      const b = el('button', 'chip' + (k === v ? ' on' : ''), t); b.type = 'button';
      if (badge[k]) b.append(el('span', 'badge', String(badge[k])));
      b.onclick = () => show(k); T.append(b);
    });
    try { history.replaceState(null, '', location.pathname + (HASHV[v] || '')); } catch (e) {}
  }
  async function loadBadges() {
    try {
      const [p, r] = await Promise.all([api('/api/admin/social?view=pending'), api('/api/admin/social?view=reports')]);
      badge.pending = (p.posts || []).length; badge.reports = (r.reports || []).length; drawNav(cur);
    } catch (e) {}
  }

  // 게시물 그림 전체 보기
  async function viewMedia(post) {
    const ov = el('div', 'modal-ov'); const box = el('div', 'card modal-box'); box.style.maxWidth = '720px';
    box.append(el('h2', '', post.title), el('p', 'sub', '불러오는 중...'));
    const close = el('button', 'btn btn-sub', '닫기'); close.type = 'button'; close.onclick = () => ov.remove();
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    ov.append(box); document.body.append(ov);
    try {
      const d = await api('/api/admin/social?view=post&id=' + post.id);
      box.querySelector('.sub').textContent = post.caption || '';
      const v = el('div', 'post-view');
      d.media.forEach((m, idx) => {
        if (d.media.length > 1) v.append(el('div', 'hint', '장면 ' + (idx + 1)));
        if (m.url) {
          if (m.type === 'video') { const vv = el('video'); vv.src = m.url; vv.controls = true; vv.playsInline = true; vv.style.cssText = 'display:block;width:100%;margin-bottom:8px;background:#000'; v.append(vv); }
          else { const i = el('img'); i.src = m.url; v.append(i); }
        }
        // 더빙 녹음도 들어 보고 검토
        if (m.audio_url) { const a = el('audio'); a.src = m.audio_url; a.controls = true; a.preload = 'none'; a.style.cssText = 'width:100%;margin-bottom:6px'; v.append(a); }
        if (m.body) v.append(el('p', 'post-body', m.body));
      });
      box.append(v);
    } catch (e) { box.querySelector('.sub').textContent = e.message; }
    box.append(close);
  }

  function postRow(p, extra) {
    const row = el('div', 'adm-row');
    const img = el('img'); img.alt = ''; if (p.cover && p.cover.url) img.src = p.cover.url; img.onclick = () => viewMedia(p);
    const g = el('div', 'grow');
    g.append(el('div', 'post-title', p.title + ' (' + (KIND[p.kind] || p.kind) + ', ' + p.media_count + '장)'));
    const who = el('a', '', (p.owner && p.owner.nickname) || '(알 수 없음)'); who.href = '#'; who.onclick = e => { e.preventDefault(); show('user', { id: p.owner_id }); };
    const sub = el('div', 'post-sub'); sub.append('작성자 ', who, ' · ' + dt(p.created_at) + (p.report_count ? ' · 신고 ' + p.report_count + '명' : ''));
    g.append(sub);
    if (p.status_reason) g.append(el('div', 'post-status st-hidden', '사유: ' + (p.status_reason === 'auto_hidden' ? '신고 누적 자동 가림' : p.status_reason === 'account_suspended' ? '계정 이용 정지' : p.status_reason)));
    if (p.caption) g.append(el('div', 'hint', p.caption.slice(0, 200)));
    const acts = el('div', 'acts');
    const b = (t, fn) => { const x = el('button', 'chip', t); x.type = 'button'; x.onclick = fn; acts.append(x); };
    b('그림 보기', () => viewMedia(p));
    if (p.status === 'pending' || p.status === 'rejected') b('✅ 승인(공개)', () => act({ action: 'approve', post_id: p.id }, '공개했어요'));
    if (p.status === 'pending') b('거절', () => { const r = ask('거절 사유 (게시자에게 보여요)'); if (r) act({ action: 'reject', post_id: p.id, reason: r }); });
    if (p.status === 'published') b('가리기', () => { const r = ask('가리는 사유 (게시자에게 보여요)'); if (r) act({ action: 'hide', post_id: p.id, reason: r }); });
    if (p.status === 'hidden') b('다시 공개 (신고 기각)', () => act({ action: 'restore', post_id: p.id }, '다시 공개했어요'));
    if (p.status !== 'deleted') b('🗑 삭제', () => { const r = ask('삭제 사유 (게시자에게 보여요). 그림 파일도 지워지고 되돌릴 수 없어요.'); if (r) act({ action: 'remove', post_id: p.id, reason: r }, '삭제했어요'); });
    if (extra) extra(acts);
    g.append(acts); row.append(img, g);
    return row;
  }

  function commentRow(c, extra) {
    const row = el('div', 'adm-row'); const g = el('div', 'grow');
    g.append(el('div', 'post-title', '💬 댓글 — ' + ((c.post && c.post.title) || '게시물')));
    const who = el('a', '', (c.author && c.author.nickname) || '(알 수 없음)'); who.href = '#';
    who.onclick = e => { e.preventDefault(); show('user', { id: c.author_id }); };
    const sub = el('div', 'post-sub'); sub.append('작성자 ', who, ' · ' + dt(c.created_at) + (c.report_count ? ' · 신고 ' + c.report_count + '명' : '') + ' · ' + ({ visible: '보이는 중', hidden: '가려짐', deleted: '삭제됨' }[c.status] || c.status));
    g.append(sub, el('div', 'post-body', c.body));
    if (c.status_reason) g.append(el('div', 'post-status st-hidden', '사유: ' + (c.status_reason === 'auto_hidden' ? '신고 누적 자동 가림' : c.status_reason)));
    const acts = el('div', 'acts');
    const b = (t, fn) => { const x = el('button', 'chip', t); x.type = 'button'; x.onclick = fn; acts.append(x); };
    const pv = el('a', 'chip', '게시물 보기'); pv.href = '/post?id=' + c.post_id; pv.target = '_blank'; pv.rel = 'noopener'; pv.style.textDecoration = 'none'; acts.append(pv);
    if (c.status === 'visible') b('가리기', () => { const r = ask('가리는 사유 (댓글 쓴 사람에게 보여요)'); if (r) act({ action: 'hide_comment', comment_id: c.id, reason: r }); });
    if (c.status === 'hidden') b('다시 보이기 (신고 기각)', () => act({ action: 'restore_comment', comment_id: c.id }));
    if (c.status !== 'deleted') b('🗑 삭제', () => { const r = ask('삭제 사유 (댓글 쓴 사람에게 보여요)'); if (r) act({ action: 'remove_comment', comment_id: c.id, reason: r }, '삭제했어요'); });
    if (extra) extra(acts);
    g.append(acts); row.append(g);
    return row;
  }

  async function show(v, opt) {
    cur = v;
    drawNav(v);
    const view = $('view'); view.innerHTML = '불러오는 중...';
    try {
      if (['pending', 'hidden', 'published', 'rejected'].includes(v)) {
        const d = await api('/api/admin/social?view=' + v);
        view.innerHTML = '';
        if (!d.posts.length) view.append(el('div', 'empty', '없어요.'));
        d.posts.forEach(p => view.append(postRow(p)));
      } else if (v === 'reports') {
        const d = await api('/api/admin/social?view=reports');
        view.innerHTML = '';
        if (!d.reports.length) view.append(el('div', 'empty', '처리할 신고가 없어요.'));
        d.reports.forEach(r => {
          const head = el('div', 'hint', '🚩 ' + (REASON[r.reason] || r.reason) + (r.detail ? ' — "' + r.detail + '"' : '') + ' · 신고자 ' + ((r.reporter && r.reporter.nickname) || '(탈퇴)') + ' · ' + dt(r.created_at));
          head.style.cssText = 'color:var(--yellow);margin-top:10px';
          view.append(head);
          const extra = acts => {
            const b = (t, fn) => { const x = el('button', 'chip', t); x.type = 'button'; x.onclick = fn; acts.append(x); };
            b('신고 처리 완료', () => act({ action: 'resolve_report', report_id: r.id, resolution: ask('처리 내용 메모 (선택)') || '' }));
            b('문제없음(기각)', () => act({ action: 'dismiss_report', report_id: r.id }));
            b('작성자 제재…', () => show('user', { id: r.target_owner, report_id: r.id }));
          };
          if (r.target_type === 'post' && r.post) view.append(postRow(r.post, extra));
          else if (r.target_type === 'comment' && r.comment) view.append(commentRow(r.comment, extra));
          else {
            const row = el('div', 'adm-row'); const g = el('div', 'grow');
            g.append(el('div', 'post-title', r.target_type === 'profile' ? '프로필 신고: ' + ((r.owner && r.owner.nickname) || '(알 수 없음)') : '삭제된 게시물'));
            const acts = el('div', 'acts'); extra(acts); g.append(acts); row.append(g); view.append(row);
          }
        });
      } else if (v === 'user') {
        view.innerHTML = '';
        const sr = el('div', 'row2'); const q = el('input'); q.type = 'text'; q.placeholder = '닉네임으로 찾기'; q.value = (opt && opt.n) || '';
        const go = el('button', 'btn btn-main', '찾기'); go.type = 'button'; go.style.marginBottom = '0';
        go.onclick = () => show('user', { n: q.value.trim() });
        sr.append(q, go); view.append(sr);
        if (!opt || (!opt.id && !opt.n)) return;
        const d = await api('/api/admin/social?view=user&' + (opt.id ? 'id=' + opt.id : 'n=' + encodeURIComponent(opt.n)));
        const p = d.profile;
        view.append(el('h2', '', p.nickname + (p.role === 'admin' ? ' (관리자 역할)' : '')));
        view.append(el('p', 'sub', '가입 ' + dt(p.created_at) + ' · 프로필 ' + p.visibility + ' · 받은 신고 ' + d.reports.length + '건 · 이 회원을 차단한 사람 ' + (d.blocked_by_count || 0) + '명'));
        view.append(el('h2', '', '제재 기록'));
        if (!d.sanctions.length) view.append(el('div', 'hint', '없어요.'));
        d.sanctions.forEach(s => {
          const active = !s.revoked_at && (!s.ends_at || new Date(s.ends_at) > new Date());

        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.88));

  // ── 🎨 콘텐츠: 공통 도우미 ──
  // 투명 배경을 살리려고 PNG 그대로(4MB 넘으면 긴 쪽 1600px PNG 로 줄임)
  function readImage(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => {
        const data = String(r.result || '');
        if (data.length < 5.5e6) return res(data);
        const im = new Image();
        im.onload = () => {
          const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
          const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/png'));
        };
        im.onerror = () => rej(new Error('그림을 읽지 못했어요.')); im.src = data;
      };
      r.onerror = () => rej(new Error('그림을 읽지 못했어요.')); r.readAsDataURL(file);
    });
  }
  async function uploadData(dataUrl, path) {

    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.url) throw new Error(j.error === 'file_too_large' ? '그림이 너무 커요 (5MB까지).' : j.error === 'invalid_file_type' ? 'PNG·JPG·WEBP 그림만 올릴 수 있어요.' : '그림을 올리지 못했어요.');
    return j.url;
  }

        let src = form.image;
        if (src.startsWith('data:')) {
          const name = 'quiz/quiz_' + Date.now() + '.jpg';
          const r = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': HASH }, body: JSON.stringify({ fileName: name, fileData: src }) });
          const j = await r.json().catch(() => ({}));
          if (!r.ok || !j.url) throw new Error('그림을 올리지 못했어요.');
          src = j.url;
        }
        const id = form.id || 'quiz_' + Date.now();
        await itemsCall('POST', { id, category: 'quiz', label: question, emoji: '❓', src, src_back: JSON.stringify(opts), bg_emoji: String(form.correct), sort_order: 0 });
        status('저장했어요 ✓', 'ok'); renderQuiz(view);
      } catch (e) { status(e.message, 'err'); save.disabled = false; }
    };
    const cancel = el('button', 'btn btn-sub', '새로 쓰기'); cancel.type = 'button'; cancel.onclick = reset;
    mk.append(el('label', '', '그림'), file, prev, el('label', '', '질문'), qIn, el('label', '', '보기 (동그라미를 눌러 정답 고르기)'), optBox);
    const br = el('div', 'acts'); br.style.marginTop = '8px'; br.append(save, cancel); mk.append(br);
    view.append(mk); drawOpts();
    // 목록
    const q2 = el('input'); q2.type = 'text'; q2.placeholder = '🔍 질문·보기 찾기';
    const grid = el('div', 'igrid'); grid.style.marginTop = '8px';
    view.append(q2, grid);
    const draw = () => {
      grid.innerHTML = '';
      const k = q2.value.trim();
      const rows = qs.filter(q => !k || q.question.includes(k) || q.options.some(o => String(o).includes(k)));
      if (!rows.length) { grid.append(el('div', 'empty', qs.length ? '없어요.' : '아직 퀴즈가 없어요.')); return; }
      rows.forEach(q => {
        const c = el('div', 'icard');
        const im = el('img'); im.src = q.image; im.alt = ''; im.loading = 'lazy'; c.append(im, el('b', '', q.question));
        const ol = el('div'); ol.style.fontSize = '.8rem';
        q.options.forEach((o, i) => ol.append(el('div', i === q.correct ? 'need-ok' : '', (i === q.correct ? '✔ ' : '· ') + o)));
        c.append(ol);
        const row = el('div', 'row');
        const e1 = el('button', 'mini', '✏️ 고치기'); e1.type = 'button';
        e1.onclick = () => { form.id = q.id; form.image = q.image; form.options = [...q.options]; form.correct = q.correct; qIn.value = q.question; prev.src = q.image; prev.style.display = 'block'; sum.textContent = '✏️ 퀴즈 고치기'; mk.open = true; drawOpts(); mk.scrollIntoView({ behavior: 'smooth' }); };
        const e2 = el('button', 'mini danger', '🗑 지우기'); e2.type = 'button';
        e2.onclick = async () => { if (!confirm('"' + q.question + '" 퀴즈를 지울까요?')) return; try { await itemsCall('DELETE', { id: q.id }); status('지웠어요', 'ok'); renderQuiz(view); } catch (e) { status(e.message, 'err'); } };
        row.append(e1, e2); c.append(row); grid.append(c);
      });
    };
    q2.oninput = draw; draw();
  }

  async function renderMemoryTab(view) {
    const d = await api('/api/admin/games');
    view.innerHTML = '';
    const head = el('div', 'sec-head'); head.append(el('h2', '', '🧠 기억 조각 그림 — 닮은꼴 세트')); view.append(head);
    view.append(el('p', 'hint', '거의 같은 캐릭터 4장이 한 세트예요. 한두 군데만 달라서 부위를 맡은 친구들이 잘 기억해 그려야 맞힐 수 있어요. 라운드마다 세트 하나를 쓰고, 세트가 없거나 다 쓰면 기본 캐릭터(' + d.characters + '개)로 해요.'));
    const box = el('div'); view.append(box);
    await renderMemory(box);
  }
  async function renderPuzzleTab(view) {
    view.innerHTML = '';
    const head = el('div', 'sec-head'); head.append(el('h2', '', '🧩 그림 퍼즐 그림')); view.append(head);
    view.append(el('p', 'hint', '올린 그림은 자동으로 퍼즐 조각으로 나뉘어요. 볼드하다가 쓸 권리가 있는 그림만 올려 주세요 (직접 그린 그림, 동의 받은 학생 작품, 저작권이 끝난 명화 등). 가로 그림이 퍼즐로 좋아요.'));
    const box = el('div'); view.append(box);
    await renderPuzzles(box);
  }
})();
</script>
